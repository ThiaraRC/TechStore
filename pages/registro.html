<main>


<section>


<h2>Crear cuenta</h2>


<form id="formRegistro" class="form-registro" novalidate>

    <div class="campo-registro">
        <label for="nombre">Nombres:</label>
        <input type="text" id="nombre" name="nombre" required>
    </div>

    <div class="campo-registro">
        <label for="apellido">Apellidos:</label>
        <input type="text" id="apellido" name="apellido" required>
    </div>

    <div class="campo-registro">
       <label for="run">RUN (sin puntos ni guion):</label>
        <input type="text" id="run" name="run"
               placeholder="Ej: 19011022K"
               maxlength="9"
               required>
    </div>

    <div class="campo-registro">
        <label for="direccion">Dirección:</label>
        <input type="text" id="direccion" name="direccion" required>
    </div>

    <div class="campo-registro">
        <label for="region">Región:</label>
        <select id="region" name="region" required>
            <option value="">Seleccione una región</option>
        </select>
    </div>

    <div class="campo-registro">
        <label for="comuna">Comuna:</label>
        <select id="comuna" name="comuna" required>
            <option value="">Seleccione una comuna</option>
        </select>
    </div>

    <div class="campo-registro">
        <label for="correo">Correo:</label>
        <input type="email" id="correo" name="correo" required>
    </div>

    <div class="campo-registro">
        <label for="fechaNacimiento">Fecha de nacimiento:</label>
        <input type="date"
               id="fechaNacimiento"
               name="fechaNacimiento">
    </div>

    <div class="campo-registro">
        <label for="password">Contraseña:</label>
        <input type="password" id="password" name="password" required>
    </div>

    <div class="campo-registro">
        <label for="confirmarPassword">Confirmar contraseña:</label>
        <input type="password"
               id="confirmarPassword"
               name="confirmarPassword"
               required>
    </div>

    <button type="submit" class="boton-registro">
        Registrarse
    </button>

    <div id="mensajeValidacion"></div>

</form>

</section>
