<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Detalle de orden - Tech Store</title>

    <link rel="stylesheet" href="../css/estilos.css">

    <style>

        .pagina-detalle-orden main {
            max-width: 1050px;
            margin: 40px auto;
            padding: 0 25px;
        }

        .detalle-orden-contenedor {
            background: white;
            padding: 28px;
            border-radius: 16px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
        }

        .datos-orden {
            margin: 18px 0 28px;
            padding: 18px;
            background: #f8f5ff;
            border-radius: 12px;
        }

        .datos-orden p {
            margin: 8px 0;
        }

        .tabla-detalle-orden {
            width: 100%;
            border-collapse: collapse;
            margin-top: 16px;
        }

        .tabla-detalle-orden th,
        .tabla-detalle-orden td {
            padding: 12px 14px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        .tabla-detalle-orden th {
            background-color: #7c3aed;
            color: white;
        }

        .total-orden {
            text-align: right;
            margin-top: 22px;
            font-size: 20px;
            color: #6d28d9;
        }

        .volver-ordenes {
            margin-top: 25px;
        }

        .volver-ordenes a {
            display: inline-block;
            text-decoration: none;
            color: #7c3aed;
            font-weight: 700;
        }

        @media (max-width: 700px) {

            .tabla-detalle-orden {
                font-size: 13px;
            }

            .tabla-detalle-orden th,
            .tabla-detalle-orden td {
                padding: 9px 7px;
            }

        }

    </style>

</head>


<body class="pagina-detalle-orden">


<header>

    <img src="../img/logo.png" alt="Logo Tech Store">

    <h1>Tech Store</h1>

    <nav>

        <a href="productos-admin.html">Productos</a>

        <a href="ordenes-admin.html">Órdenes</a>

        <a href="../index.html">Inicio</a>

        <a href="../pages/login.html" id="cerrarSesion">
            Cerrar sesión
        </a>

    </nav>

</header>


<main>

    <section class="detalle-orden-contenedor">

        <div id="detalleOrden"></div>

        <div class="volver-ordenes">

            <a href="ordenes-admin.html">
                ← Volver a órdenes
            </a>

        </div>

    </section>

</main>


<footer>

    <p>
        © 2026 Tech Store - Todos los derechos reservados
    </p>

</footer>


<script src="../js/permisos.js"></script>

<script src="../js/ordenes.js"></script>

<script src="../js/sesion.js"></script>


</body>

</html>
